        <style>
            /* Define the keyframes for the glow effect */
            @keyframes glow {
            0% {
            text-shadow: 0 0 10px #00f;
            }
            50% {
            text-shadow: 0 0 20px #00f, 0 0 30px #00f;
            }
            100% {
            text-shadow: 0 0 10px #00f;
            }
            }
            /* Apply the glow effect to the H1 element */

            font-size: 2em;
            text-align: center;
            color: #fff;
            background-color: transparent;
            /* Set the background to transparent */
            padding: 20px;
            margin: 0;
            animation: glow 2s infinite;

            }
        </style>

        <script>
            function openModal() {
                const modal = document.getElementById("modal");
                modal.style.display = "block";
            }
            
            function closeModal() {
                const modal = document.getElementById("modal");
                modal.style.display = "none";
            }
            window.addEventListener("click", function(event) {
                const modal = document.getElementById("modal");
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        </script>
        <!-- Cookie Message -->
        <div id="cookie-message" style="background-color: #333; color: #fff; padding: 10px; text-align: center; position: fixed; bottom: 0; width: 100%;"> By using this site, you agree to the use of cookies. </div>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const cookieMessage = document.getElementById("cookie-message");
                // Check if the user has previously accepted cookies
                if (!localStorage.getItem("cookiesAccepted")) {
                    cookieMessage.style.display = "block";
                }
                // Hide the cookie message and set a cookie on click
                document.addEventListener("click", function() {
                    localStorage.setItem("cookiesAccepted", "true");
                    cookieMessage.style.display = "none";
                });
            });
